function fmtK(n) {
  if (!n) return '0';
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
  return n.toLocaleString();
}

let _searchQuery = '';
let _searchMatches = [];  // D3 nodes whose name matches (bubble highlights)
let _urlMatches = [];     // {node, urls} — leaf nodes with matching URLs
let _searchIdx = 0;

function allNodes(node, result = []) {
  result.push(node);
  (node.children || node._children || []).forEach(c => allNodes(c, result));
  return result;
}

function totalResults() { return _searchMatches.length + _urlMatches.length; }

function onSearch(q) {
  _searchQuery = q.trim().toLowerCase();
  if (_searchQuery) {
    const nameMatches = allNodes(root).filter(d => d.depth > 0 && d.data.name.toLowerCase().includes(_searchQuery));
    const nameMatchSet = new Set(nameMatches);
    _searchMatches = nameMatches;
    _urlMatches = [];
    allNodes(root).forEach(d => {
      if (d.data.urls && !nameMatchSet.has(d)) {
        const hits = d.data.urls.filter(u => u.url && u.url.toLowerCase().includes(_searchQuery));
        if (hits.length) _urlMatches.push({node: d, urls: hits});
      }
    });
  } else {
    _searchMatches = [];
    _urlMatches = [];
  }
  _searchIdx = 0;
  updateSearchCount();
  update(root);
  if (totalResults() > 0) navigateToIdx(0);
}

function onSearchKey(e) {
  if (e.key === 'Enter') { e.preventDefault(); searchNav(e.shiftKey ? -1 : 1); }
  if (e.key === 'Escape') { document.getElementById('search-input').value = ''; onSearch(''); }
}

function searchNav(dir) {
  if (!totalResults()) return;
  _searchIdx = (_searchIdx + dir + totalResults()) % totalResults();
  updateSearchCount();
  navigateToIdx(_searchIdx);
}

function navigateToIdx(idx) {
  if (idx < _searchMatches.length) {
    const d = _searchMatches[idx];
    revealAndZoom(d);
    if (d.data.urls) {
      setTimeout(() => showUrls(d), 500);
    } else {
      closePanel();
    }
  } else {
    const m = _urlMatches[idx - _searchMatches.length];
    const d = m.node;
    // Expand d itself (in case it's a cluster with collapsed children) and all ancestors
    let node = d;
    while (node) {
      if (node._children) { node.children = node._children; node._children = null; }
      node = node.parent;
    }
    update(root);
    setTimeout(() => {
      const scale = 1.6;
      svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(-d.y * scale, -d.x * scale).scale(scale));
    }, 420);
    setTimeout(() => showFilteredUrls(d, m.urls), 500);
  }
}

function updateSearchCount() {
  const el = document.getElementById('search-count');
  const prev = document.getElementById('search-prev');
  const next = document.getElementById('search-next');
  const total = totalResults();
  if (!_searchQuery) {
    el.textContent = ''; el.className = 'search-count';
    prev.disabled = next.disabled = true;
  } else if (total === 0) {
    el.textContent = 'No match'; el.className = 'search-count no-match';
    prev.disabled = next.disabled = true;
  } else {
    const inUrls = _searchIdx >= _searchMatches.length;
    el.textContent = `${_searchIdx + 1} / ${total}${inUrls ? ' (URLs)' : ''}`;
    el.className = 'search-count';
    prev.disabled = next.disabled = false;
  }
}

function revealAndZoom(d) {
  let node = d;
  while (node.parent) {
    if (node.parent._children) { node.parent.children = node.parent._children; node.parent._children = null; }
    node = node.parent;
  }
  update(root);
  setTimeout(() => {
    const scale = 1.6;
    const tx = -d.y * scale;
    const ty = -d.x * scale;
    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  }, 420);
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  _searchQuery = ''; _searchMatches = []; _urlMatches = []; _searchIdx = 0;
  updateSearchCount();
}

  statsEl.appendChild(totalCard);
  ds.group_summary.forEach(g => {
    const el = document.createElement('div');

    statsEl.appendChild(el);
  });
}

function computeDx() {
  let maxR = 12;
  root.descendants().forEach(d => { const r = nodeRadius(d); if (r > maxR) maxR = r; });
  return maxR * 2 + 20;
}

function initTree() {
  const ds = DATASETS[activeKey];
  USE_CLICKS = ds.total_clicks > 0;
  gLinks.selectAll('*').remove();
  gNodes.selectAll('*').remove();
  root = d3.hierarchy(ds.tree);
  root.x0 = 0; root.y0 = 0;
  root.children.forEach(groupNode => {
    const color = groupNode.data.color;
    groupNode.each(n => n.groupColor = color);
  });
  root.sum(d => USE_CLICKS ? (d.clicks || 0) : (d.count || 0));
  root.descendants().forEach(d => {
    if (d.depth >= 1 && d.children) { d._children = d.children; d.children = null; }
  });

  update(root);

}

function switchRange(key) {
  if (key === activeKey) return;
  activeKey = key;
  document.querySelectorAll('.range-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.range === key);

  updateLegend();
  renderStats();
  updateNewPagesBtn();
  initTree();
}

function nodeRadius(d) {
  if (d.depth === 0) {
    if (!USE_CLICKS || !d.value) return 22;
    return Math.max(22, Math.min(52, Math.log10(d.value + 1) * 10));
  }
  const v = d.value || 0;
  if (!USE_CLICKS || v === 0) {
    return Math.max(5, Math.min(32, Math.sqrt(v || 1) * 1.4));
  }
  return Math.max(4, Math.min(42, Math.log10(v + 1) * 8));
}

function update(source) {
  d3.tree().nodeSize([computeDx(), dy])(root);
  const nodes = root.descendants(), links = root.links();

  const link = gLinks.selectAll("path.link")

  const urlMatchNodes = new Set(_urlMatches.map(m => m.node));
  const allMatchNodes = new Set([...matchSet, ...urlMatchNodes]);
  const currentNode = _searchIdx < _searchMatches.length
    ? _searchMatches[_searchIdx]
    : (_urlMatches[_searchIdx - _searchMatches.length] || {}).node;
  nodeUpdate
    .classed("search-match", d => allMatchNodes.has(d))
    .classed("search-current", d => d === currentNode)
    .classed("search-dim", d => _searchQuery.length > 0 && allMatchNodes.size > 0 && !allMatchNodes.has(d));
  nodeUpdate.select("text.inner")
    .text(d => {
      if (!USE_CLICKS || !d.value) return '';
      return nodeRadius(d) >= 12 ? fmtK(d.value) : '';
    });
  nodeUpdate.select("text.outer")
    .attr("x", d => (d._children || d.children) && d.depth > 0 ? -nodeRadius(d) - 6 : nodeRadius(d) + 6)
    .attr("text-anchor", d => (d._children || d.children) && d.depth > 0 ? "end" : "start");

  nodeUpdate.select("text.new-label")
    .attr("y", d => -(nodeRadius(d) + 4));

  node.exit().transition().duration(400)
    .attr("transform", () => `translate(${source.y},${source.x})`)
    .attr("opacity", 0).remove();
  root.each(d => { d.x0 = d.x; d.y0 = d.y; });
}

function diagonal(d) {
  return `M${d.source.y},${d.source.x} C${(d.source.y+d.target.y)/2},${d.source.x} ${(d.source.y+d.target.y)/2},${d.target.x} ${d.target.y},${d.target.x}`;
}

function expandAll() {
  root.each(d => { if (d._children) { d.children = d._children; d._children = null; } });
  update(root); setTimeout(fitToView, 450);
}
function collapseAll() {
  root.each(d => { if (d.depth >= 1 && d.children) { d._children = d.children; d.children = null; } });
  update(root); setTimeout(fitToView, 450);
}
function resetView() { fitToView(); }

function fitToView() {
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  root.descendants().forEach(d => {
    if (d.x<x0) x0=d.x; if (d.x>x1) x1=d.x;
    if (d.y<y0) y0=d.y; if (d.y>y1) y1=d.y;
  });
  const bw=(y1-y0)+300, bh=(x1-x0)+100;
  const scale = Math.min(0.95, (width-280)/bw, (height-140)/bh);
  const tx = -((y0+y1)/2)*scale + (width/2 - 140) - width/2;
  const ty = -((x0+x1)/2)*scale;
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(scale));
}

const tooltip = document.getElementById('tooltip');
function showTooltip(event, d) {
  if (d.depth === 0) return;
  const urlCount = d.data.count || (d.data.urls ? d.data.urls.length : 0);
  const clicks = d.value || 0;
  const hasChildren = d._children || d.children;
  let html = `<strong>${d.data.name}</strong>`;
  html += `<span class="metric">${urlCount} URL${urlCount===1?'':'s'}`;
  if (USE_CLICKS && clicks > 0) html += ` · ${fmtK(clicks)} clicks`;
  if (d.data.new_count) html += ` · <span style="color:#27AE60;font-weight:700">${d.data.new_count} new</span>`;
  html += `</span>`;
  html += `<div class="hint">${hasChildren ? 'Click to ' + (d.children ? 'collapse' : 'expand') : 'Click to view page data'}</div>`;
  tooltip.innerHTML = html;
  moveTooltip(event);
  tooltip.classList.add('visible');
}
function moveTooltip(event) {
  tooltip.style.left = (event.clientX + 14) + 'px';
  tooltip.style.top = (event.clientY + 14) + 'px';
}
function hideTooltip() { tooltip.classList.remove('visible'); }

function posClass(p) {
  if (p === null || p === undefined) return 'pos-low';
  if (p <= 10) return 'pos-good';
  if (p <= 30) return 'pos-mid';
  return 'pos-low';
}

function buildExportRows(urls) {
  if (USE_CLICKS) {
    return urls.map(u => ({
      URL: u.url,
      Clicks: u.clicks || 0,
      Impressions: u.impressions || 0,
      'Avg Position': u.position !== null && u.position !== undefined ? u.position : '',
    }));
  }
  return urls.map(u => ({ URL: typeof u === 'string' ? u : u.url }));
}

function slugify(s) { return s.replace(/[^a-z0-9]+/gi, '_').replace(/^_|_$/g, '').toLowerCase(); }

function exportCSV() {
  if (!_exportRows.length) return;
  const headers = Object.keys(_exportRows[0]);
  const lines = [headers.join(','), ..._exportRows.map(r =>
    headers.map(h => { const v = r[h]; return typeof v === 'string' && v.includes(',') ? `"${v}"` : v; }).join(',')
  )];
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `oxylabs_${slugify(_exportTitle)}.csv`;
  a.click();
}

function exportXLSX() {
  if (!_exportRows.length) return;
  const ws = XLSX.utils.json_to_sheet(_exportRows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, _exportTitle.slice(0, 31));
  XLSX.writeFile(wb, `oxylabs_${slugify(_exportTitle)}.xlsx`);
}

let _currentUrls = [];
let _sortCol = null;
let _sortDir = -1;

function sortUrls(urls, col, dir) {
  if (!col) return urls;
  return [...urls].sort((a, b) => {
    if (col === 'url') {
      const av = (a.url || '').replace('https://oxylabs.io', '');
      const bv = (b.url || '').replace('https://oxylabs.io', '');
      return dir * av.localeCompare(bv);
    }
    const av = (a[col] == null) ? (col === 'position' ? 9999 : -1) : a[col];
    const bv = (b[col] == null) ? (col === 'position' ? 9999 : -1) : b[col];
    return dir * (av - bv);
  });
}

function buildTableHeader() {
  function th(col, label, cls) {
    const active = _sortCol === col;
    const arrow = active ? (_sortDir === -1 ? ' ↓' : ' ↑') : ' ↕';
    const activeCls = active ? ' sort-active' : '';
    return `<th class="${cls}sortable${activeCls}" onclick="sortBy('${col}')">${label}<span class="sort-ind">${arrow}</span></th>`;
  }
  let html = th('url', 'URL', '');
  if (USE_CLICKS) {
    html += th('clicks', 'Clicks', 'num ');
    html += th('impressions', 'Impr.', 'num ');
    html += th('position', 'Avg Pos', 'num ');
  }
  return `<thead><tr>${html}</tr></thead>`;
}

function renderTableBody() {
  const tbody = document.querySelector('#panel-urls .url-table tbody');
  if (!tbody) return;
  tbody.innerHTML = '';
  sortUrls(_currentUrls, _sortCol, _sortDir).forEach(item => {
    const url = typeof item === 'string' ? item : item.url;
    const path = url.replace('https://oxylabs.io', '') || '/';
    const tr = document.createElement('tr');
    const newBadge = item.is_new ? '<span class="badge-new">new</span>' : '';
    let cells = `<td><a href="${url}" target="_blank" rel="noopener" class="url-link">${path}</a>${newBadge}</td>`;
    if (USE_CLICKS) {
      const pos = item.position;
      const noData = item.is_new && !item.clicks && !item.impressions;
      cells += `<td class="num">${noData ? '—' : (item.clicks || 0).toLocaleString()}</td>`;
      cells += `<td class="num">${noData ? '—' : (item.impressions || 0).toLocaleString()}</td>`;
      cells += `<td class="pos ${noData ? 'pos-low' : posClass(pos)}">${noData ? '—' : (pos !== null && pos !== undefined) ? pos.toFixed(1) : '—'}</td>`;
    }
    tr.innerHTML = cells;
    tbody.appendChild(tr);
  });
}

function sortBy(col) {
  _sortDir = (_sortCol === col) ? _sortDir * -1 : (col === 'url' ? 1 : -1);
  _sortCol = col;
  const table = document.querySelector('#panel-urls .url-table');
  table.querySelector('thead').remove();
  table.insertAdjacentHTML('afterbegin', buildTableHeader());
  renderTableBody();
  _exportRows = buildExportRows(sortUrls(_currentUrls, _sortCol, _sortDir));
}

function showUrls(d) {
  _currentUrls = d.data.urls || [];
  _sortCol = USE_CLICKS ? 'clicks' : 'url';
  _sortDir = USE_CLICKS ? -1 : 1;
  _exportTitle = d.data.name;
  _exportRows = buildExportRows(_currentUrls);

  document.getElementById('panel-title').textContent = d.data.name;
  const totalClicks = _currentUrls.reduce((s, u) => s + (u.clicks || 0), 0);
  const totalImpr = _currentUrls.reduce((s, u) => s + (u.impressions || 0), 0);
  let meta = `${_currentUrls.length} URL${_currentUrls.length === 1 ? '' : 's'}`;
  if (USE_CLICKS && totalClicks > 0) meta += ` · ${fmtK(totalClicks)} clicks · ${fmtK(totalImpr)} impressions`;
  meta += ` · ${d.parent.data.name}`;
  document.getElementById('panel-meta').textContent = meta;

  const urlsEl = document.getElementById('panel-urls');
  urlsEl.innerHTML = '';
  const table = document.createElement('table');
  table.className = 'url-table';
  table.innerHTML = buildTableHeader();
  table.appendChild(document.createElement('tbody'));
  urlsEl.appendChild(table);
  renderTableBody();
  document.getElementById('panel').classList.add('open');
  autoFitPanel();
}
function showFilteredUrls(d, filteredUrls) {
  showUrls(d);
  _currentUrls = filteredUrls;
  const totalClicks = _currentUrls.reduce((s, u) => s + (u.clicks || 0), 0);
  const totalImpr = _currentUrls.reduce((s, u) => s + (u.impressions || 0), 0);
  const all = (d.data.urls || []).length;
  let meta = `${_currentUrls.length} of ${all} URL${all === 1 ? '' : 's'} match "${_searchQuery}"`;
  if (USE_CLICKS && totalClicks > 0) meta += ` · ${fmtK(totalClicks)} clicks · ${fmtK(totalImpr)} impressions`;
  meta += ` · ${d.parent ? d.parent.data.name : ''}`;
  document.getElementById('panel-meta').textContent = meta;
  _exportRows = buildExportRows(_currentUrls);
  renderTableBody();
}
function closePanel() { document.getElementById('panel').classList.remove('open'); }

// ---------- New Pages Tab ----------
let _newPagesSortCol = 'clicks';
let _newPagesSortDir = -1;

function updateNewPagesBtn() {
  const pages = DATASETS[activeKey].new_pages || [];
  const btn = document.getElementById('new-pages-btn');
  const countEl = document.getElementById('new-pages-count');
  if (pages.length > 0) {
    countEl.textContent = `(${pages.length})`;
    btn.classList.add('has-new');
  } else {
    countEl.textContent = '';
    btn.classList.remove('has-new');
  }
}

function buildNewPagesHeader() {
  function th(col, label, cls) {
    const active = _newPagesSortCol === col;
    const arrow = active ? (_newPagesSortDir === -1 ? ' ↓' : ' ↑') : ' ↕';
    const activeCls = active ? ' sort-active' : '';
    return `<th class="${cls}sortable${activeCls}" onclick="sortNewPagesBy('${col}')">${label}<span class="sort-ind">${arrow}</span></th>`;
  }
  let html = th('url', 'URL', '');
  html += th('topic', 'Topic', '');
  html += th('first_seen', 'First seen', 'num ');
  return `<thead><tr>${html}</tr></thead>`;
}

function renderNewPagesBody() {
  const tbody = document.querySelector('#panel-urls .url-table tbody');
  if (!tbody) return;
  const pages = DATASETS[activeKey].new_pages || [];
  const col = _newPagesSortCol;
  const dir = _newPagesSortDir;
  const sorted = [...pages].sort((a, b) => {
    if (col === 'url') return dir * (a.url || '').replace('https://oxylabs.io','').localeCompare((b.url || '').replace('https://oxylabs.io',''));
    if (col === 'topic') return dir * (a.topic || '').localeCompare(b.topic || '');
    if (col === 'first_seen') return dir * (a.first_seen || '').localeCompare(b.first_seen || '');
    const av = (a[col] == null) ? (col === 'position' ? 9999 : -1) : a[col];
    const bv = (b[col] == null) ? (col === 'position' ? 9999 : -1) : b[col];
    return dir * (av - bv);
  });
  tbody.innerHTML = '';
  sorted.forEach(item => {
    const path = item.url.replace('https://oxylabs.io', '') || '/';
    const tr = document.createElement('tr');
    let cells = `<td><a href="${item.url}" target="_blank" rel="noopener" class="url-link">${path}</a></td>`;
    cells += `<td style="color:#b8c2d6;font-size:10px;" title="${item.topic || ''}">${item.topic || '—'}</td>`;
    cells += `<td class="num" style="font-size:10px;white-space:nowrap;">${item.first_seen || '—'}</td>`;
    tr.innerHTML = cells;
    tbody.appendChild(tr);
  });
  _exportRows = sorted.map(item => ({
    URL: item.url, Topic: item.topic || '', 'First seen': item.first_seen || '',
  }));
}

function sortNewPagesBy(col) {
  _newPagesSortDir = (_newPagesSortCol === col) ? _newPagesSortDir * -1 : (col === 'url' || col === 'topic' ? 1 : -1);
  _newPagesSortCol = col;
  const table = document.querySelector('#panel-urls .url-table');
  if (!table) return;
  table.querySelector('thead').remove();
  table.insertAdjacentHTML('afterbegin', buildNewPagesHeader());
  renderNewPagesBody();
}

function showNewPages() {
  const pages = DATASETS[activeKey].new_pages || [];
  _newPagesSortCol = 'first_seen';
  _newPagesSortDir = -1;
  _exportTitle = 'New pages last 7 days';

  document.getElementById('panel-title').textContent = 'New pages — last 7 days';
  let meta = `${pages.length} URL${pages.length === 1 ? '' : 's'} first seen in the last 7 days`;
  document.getElementById('panel-meta').textContent = meta;

  const urlsEl = document.getElementById('panel-urls');
  urlsEl.innerHTML = '';
  if (pages.length === 0) {
    urlsEl.innerHTML = '<div style="color:#8893a8;font-size:12px;padding:20px 0;">No new pages detected in the last 7 days.</div>';
    document.getElementById('panel').classList.add('open');
    return;
  }
  const table = document.createElement('table');
  table.className = 'url-table';
  table.innerHTML = buildNewPagesHeader();
  table.appendChild(document.createElement('tbody'));
  urlsEl.appendChild(table);
  renderNewPagesBody();
  document.getElementById('panel').classList.add('open');
  autoFitPanel();
}
// ---------- End New Pages Tab ----------

// Mark range buttons with no data
RANGE_KEYS.forEach(k => {
  const btn = document.querySelector(`.range-btn[data-range="${k}"]`);
  if (btn && DATASETS[k].total_clicks === 0) btn.classList.add('no-data');
});

// Set initial active button
document.querySelectorAll('.range-btn').forEach(btn => {
  btn.classList.toggle('active', btn.dataset.range === activeKey);
});

updateSubtitle();
updateLegend();
renderStats();
updateNewPagesBtn();
initTree();

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  svg.attr("width", w).attr("height", h).attr("viewBox", [-w/2, -h/2, w, h]);
  fitToView();
});

// Auto-fit panel to content width on open
function autoFitPanel() {
  const panel = document.getElementById('panel');
  const table = panel.querySelector('.url-table');
  if (!table) return;
  // Clone into an unconstrained off-screen ghost to measure true min-content width.
  // We must apply nowrap/word-break to every descendant (not just td/th) because
  // .url-link has word-break:break-all which would still compress the measurement.
  const ghost = document.createElement('div');
  ghost.style.cssText = 'position:fixed;top:-9999px;left:-9999px;visibility:hidden;';
  const clone = table.cloneNode(true);
  clone.style.cssText = 'width:auto;table-layout:auto;';
  clone.querySelectorAll('*').forEach(c => {
    c.style.whiteSpace = 'nowrap';
    c.style.wordBreak = 'normal';
    c.style.overflowWrap = 'normal';
    c.style.maxWidth = 'none';
  });
  ghost.appendChild(clone);
  document.body.appendChild(ghost);
  const natural = clone.offsetWidth + 36 + 8;
  document.body.removeChild(ghost);
  const maxW = window.innerWidth - 200;
  panel.style.width = Math.min(maxW, Math.max(320, natural)) + 'px';
}

// Panel resize drag
(function() {
  const handle = document.getElementById('panel-resize');
  const panel = document.getElementById('panel');
  let dragging = false, startX, startW;
  handle.addEventListener('mousedown', e => {
    dragging = true;
    startX = e.clientX;
    startW = panel.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor = 'ew-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const newW = Math.max(320, Math.min(window.innerWidth - 200, startW + (startX - e.clientX)));
    panel.style.width = newW + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();
</script>
